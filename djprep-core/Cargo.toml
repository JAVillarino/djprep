[package]
name = "djprep-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Core audio analysis library for djprep (native + wasm)"
license = "MIT"
repository = "https://github.com/JAVillarino/djprep"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["analysis-stratum", "decode-full"]

analysis-stratum = ["dep:stratum-dsp"]
analysis-lite = []

decode = ["dep:symphonia"]
decode-wav = ["decode", "symphonia/wav", "symphonia/pcm"]
decode-full = ["decode-wav", "symphonia/mp3", "symphonia/flac", "symphonia/aiff"]

wasm-bindings = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]
wasm = ["wasm-bindings", "analysis-stratum", "decode-full"]
wasm-lite = ["wasm-bindings", "analysis-lite"]

[dependencies]
symphonia = { version = "0.5", default-features = false, optional = true }
stratum-dsp = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
