name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  wasm_full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Check full wasm feature build
        run: cargo check -p djprep-core --target wasm32-unknown-unknown --features wasm

      - name: Build full wasm package
        run: wasm-pack build --target web djprep-core -- --features wasm

  wasm_lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Check lite wasm feature build
        run: cargo check -p djprep-core --target wasm32-unknown-unknown --no-default-features --features wasm-lite

      - name: Build lite wasm package
        run: wasm-pack build --target web djprep-core -- --no-default-features --features wasm-lite

      - name: Enforce lite wasm size budget (gzip <= 600KB)
        run: |
          SIZE=$(gzip -c djprep-core/pkg/djprep_core_bg.wasm | wc -c)
          echo "lite wasm gz size: ${SIZE} bytes"
          test "${SIZE}" -le 600000
